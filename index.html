<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Car Tuning Simulator</title>
<style>
:root{--bg:#0f1217;--card:#181d26;--tx:#e6e9ef;--mut:#8b94a5;--ac:#ff5a36;--ok:#3ddc97;--bd:#2a3140}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0}header{padding:14px 20px;border-bottom:1px solid var(--bd);display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}
header span{color:var(--mut)}
main{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(300px,1fr);gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:850px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:16px}
canvas{width:100%;display:block;border-radius:6px}
.ctl{margin-bottom:12px}.row{display:flex;justify-content:space-between}.rng,.desc{color:var(--mut);font-size:12px}
input[type=range]{width:100%;accent-color:var(--ac)}
button{background:var(--ac);color:#fff;border:0;border-radius:6px;padding:8px 12px;font-weight:600;cursor:pointer;margin:0 6px 6px 0}
button.alt{background:#2a3140}button:disabled{opacity:.5}
#res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#10141b;border-radius:6px;padding:8px}
.m small{display:block;color:var(--mut)}.m b{font-size:16px}#lap b{color:var(--ok);font-size:20px}
</style></head><body>
<header><h1>AI Car Tuning Simulator</h1><span>Tune the car manually, then let a Bayesian-optimization assistant find a faster setup.</span></header>
<main>
 <section>
  <div class="card"><canvas id="track" width="640" height="520"></canvas>
   <div style="display:flex;justify-content:space-between;color:var(--mut);margin-top:6px"><span id="live">Press Run Lap</span><span id="prog"></span></div></div>
  <div class="card"><b>AI learning curve</b> <span class="rng">(lap score per run, lower is better)</span><canvas id="chart" width="640" height="220"></canvas></div>
 </section>
 <section>
  <div class="card"><div id="sliders"></div>
   <button id="run">▶ Run Lap</button><button id="sug" class="alt">AI Suggest</button><button id="auto" class="alt">AI Auto-Tune (30 runs)</button><button id="reset" class="alt">Reset</button></div>
  <div class="card"><div id="res"></div><p class="rng" id="note"></p></div>
 </section>
</main>
<script src="src/track.js"></script><script src="src/physics.js"></script><script src="src/optimizer.js"></script><script src="src/ui.js"></script>
</body></html>
